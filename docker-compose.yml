services:
  mitm-grid:
    image: ghcr.io/ygrip/mitmproxy-grid:${MITMPROXY_GRID_VERSION:-latest}
    container_name: mitm-grid
    ports:
      - "8090:8090"
      - "10000-10100:10000-10100"
    volumes:
      - mitm-grid-data:/data
      - mitm-grid-ca:/ca
    environment:
      INSTANCE_TTL: ${INSTANCE_TTL:-1800}
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-52428800}
    restart: unless-stopped

volumes:
  mitm-grid-data:
  mitm-grid-ca:
